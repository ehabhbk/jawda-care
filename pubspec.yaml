name: jawda_care
description: "Jawda Care - ICU Bed & Ambulance Booking Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  provider: ^6.1.2
  google_maps_flutter: ^2.12.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  intl_phone_number_input: ^0.7.5
  shared_preferences: ^2.3.5
  file_selector: ^1.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images icon/icon_circle.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images icon/icon_circle_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images icon/

  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
